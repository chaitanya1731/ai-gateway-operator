name: Test PR label permission

on:
  pull_request:
    types:
      - opened

jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add test label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --add-label "tide/merge-method-merge"
